<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid #30363d;
        }
        h1 { color: #58a6ff; }
        .btn {
            display: block;
            background: #238636;
            color: white;
            padding: 12px;
            margin: 15px 0;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hi, I'm a Developer 👋</h1>
        <p>Welcome to my GitHub portfolio project!</p>
        <a href="https://github.com" class="btn">My GitHub Profile</a>
        <a href="mailto:example@email.com" class="btn">Contact Me</a>
    </div>
</body>
</html>
